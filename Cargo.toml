[workspace]
resolver = "2"
members = ["crates/rx", "crates/state"]

[workspace.dependencies]
state = { path = "crates/state" }
log = { version = "0.4.28", default-features = false }
esp-hal = { version = "1.0.0", default-features = false }
esp-println = { version = "0.16.1", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
