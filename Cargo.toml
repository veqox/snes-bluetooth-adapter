[workspace]
resolver = "2"
members = [
    "crates/bin",
    "crates/ble",
    "crates/macros",
    "crates/state",
    "crates/utils",
]
default-members = ["crates/bin"]

[workspace.dependencies]
ble = { path = "crates/ble" }
macros = { path = "crates/macros" }
state = { path = "crates/state" }
utils = { path = "crates/utils" }

log = { version = "0.4.26" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
